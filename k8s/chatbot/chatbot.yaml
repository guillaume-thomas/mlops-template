apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secrets
type: Opaque
stringData:
  github-models-token: "ghp_YOUR_GITHUB_TOKEN_HERE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: titanic-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: titanic-chatbot
  template:
    metadata:
      labels:
        app: titanic-chatbot
    spec:
      containers:
        - name: titanic-chatbot
          image: quay.io/gthomas59800/summit/chatbot
          env:
            - name: TITANIC_API_URL
              value: "http://mlops-api-service.gthomas59800-dev.svc.cluster.local:8080"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chatbot-secrets
                  key: github-models-token
            - name: OPENAI_BASE_URL
              value: "https://models.inference.ai.azure.com"
            - name: LLM_MODEL
              value: "gpt-4o-mini"
          ports:
            - containerPort: 8501
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: titanic-chatbot-service
spec:
  selector:
    app: titanic-chatbot
  ports:
    - port: 8501
      name: http-port
      targetPort: 8501
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: titanic-chatbot
spec:
  to:
    kind: Service
    name: titanic-chatbot-service
  port:
    targetPort: http-port
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

